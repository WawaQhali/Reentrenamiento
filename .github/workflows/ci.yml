name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  calidad:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.13.8"
      - run: uv sync --frozen
      - name: ruff
        run: uv run ruff check && uv run ruff format --check
      - name: pytest (sin TensorFlow)
        run: uv run pytest
      - name: pip-audit
        run: |
          uv export --frozen --no-dev --group entrenamiento --no-hashes --no-emit-project > requisitos.txt
          uvx pip-audit==2.9.0 --strict -r requisitos.txt

  entrenamiento:
    # Las pruebas que entrenan de verdad corren dentro de la imagen, con TensorFlow.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: docker build --target pruebas -t pruebas .
